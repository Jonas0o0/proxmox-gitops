name: "Linters (ce dépôt commun ne déploie rien + runners publics)"

on:
  push:
  workflow_dispatch:


permissions:
  contents: read
  
jobs:
  static-analysis-checkov:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Analyse checkov
        run: make lint-checkov

  static-analysis-tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse TFLint
        run: make lint-tflint

  static-analysis-hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyse Hadolint
        # Suppression de continue-on-error et no-fail pour rendre le job bloquant
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: services/**/Dockerfile


  terraform-deploy:
    # S'exécute sur le runner self-hosted (qui a accès au réseau Proxmox/S3)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/perso' || github.ref == 'refs/heads/48-Remplacement-de-Lynx-par-un-backend-S3-léger-(Rust)'
    needs: [ static-analysis-checkov, static-analysis-tflint, static-analysis-hadolint ]
    runs-on: self-hosted
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install SOPS
        uses: getsops/setup-sops@v1
        with:
          version: v3.8.1

      - name: Install j2cli
        run: |
          pip install j2cli || sudo apt-get install -y python3-j2cli || true

      - name: Détecter les changements Terraform
        id: tf_changes
        uses: tj-actions/changed-files@v47
        with:
          files: |
            terraform/environments/production/bootstrap/**
            terraform/environments/production/core/**
            terraform/modules/**
            settings.enc.yml

      # Applique BOOTSTRAP si son dossier ou des fichiers globaux ont changé
      - name: Terraform Apply (Bootstrap)
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/environments/production/bootstrap') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/modules') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'settings.enc.yml')
        run: make tf TF_LAYER=bootstrap ACTION="apply -auto-approve"

      # Applique CORE si son dossier ou des fichiers globaux ont changé
      - name: Terraform Apply (Core)
        if: |
          github.event_name == 'workflow_dispatch' ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/environments/production/core') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'terraform/modules') ||
          contains(steps.tf_changes.outputs.all_changed_files, 'settings.enc.yml')
        run: make tf TF_LAYER=core ACTION="apply -auto-approve"

  # que sur branche perso(fork)
  services-to-deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/perso'
    runs-on: self-hosted
    needs: [ static-analysis-checkov, static-analysis-tflint, static-analysis-hadolint ]
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && steps.services.outputs.folders || steps.changed.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # cas du déclenchement à la main (= prend meme ce qui a pas changé)
      - name: Liste des services
        id: services
        uses: philips-labs/list-folder-action@v3.0
        with:
          path: ./services
      - id: changed
        if: github.event_name != 'workflow_dispatch'
        uses: tj-actions/changed-files@v47
        with:
          path: services
          dir_names: true
          dir_names_max_depth: 1
          matrix: true

  ansible:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/perso') && needs.services-to-deploy.outputs.services != '[]' }}
    # donc need indirectement Checkov tflint hadolint
    needs: [ services-to-deploy ]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        # itération sur tous les services qui ont changé dans le dernier commit (ou tous si le workflow est lancé à la main). ca déploie que ce qui a changé, ça accélère grandement
        service: ${{ fromJSON(needs.services-to-deploy.outputs.services) }}
        exclude:
          - service: authentik
          - service: base-vm
          - service: kanboard
          - service: nextcloud
          - service: rasdaemon
          - service: template-vm
          - service: wgeasy
          - service: gh-runner-compose
    steps:
      - uses: actions/checkout@v4

      - name: "Setup SSH pour ${{ matrix.service }}"
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_KEY }}
          log-public-key: false

      - name: Désactiver HostKeyChecking
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Vérifier l'environnement Ansible
        run: |
          ansible-playbook --version

      - name: Install Ansible Collections(on a du docker compose community)
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      #https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
      # avec la matrix tous les services définis vont faire N déplooiements ansible
      - name: "Déploiement de ${{ matrix.service }}"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          make deploy-compose-ci SERVICE=${{ matrix.service }}